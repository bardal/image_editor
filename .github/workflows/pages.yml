name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deploy at a time; don't cancel a run that's mid-deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Nothing reaches the site until the suites pass. They drive a real Chromium
  # as both a phone and a desktop, and each one asserts its report rather than
  # only checking that the page did not throw.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save playwright@1.62.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suites
        run: ./tests/run-all.sh

  deploy:
    needs: test
    # Pull requests get the tests only; publishing happens from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API if it isn't already enabled.
          enablement: true

      # Stamps the commit into the page and the service worker cache name, so
      # the running app can report exactly which build it is and each deploy
      # invalidates the previous offline copy.
      - name: Stamp build version
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "Stamping build $SHORT_SHA ($BUILD_TIME)"
          sed -i "s|__BUILD_ID__|${SHORT_SHA}|g" index.html sw.js
          sed -i "s|__BUILD_TIME__|${BUILD_TIME}|g" index.html
          grep -q "__BUILD_ID__" index.html sw.js && { echo "::error::build id not substituted"; exit 1; }
          echo "Stamped OK"

      # No build step - the app is static HTML, so publish the repo root.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
